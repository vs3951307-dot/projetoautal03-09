services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pedidoflow
      POSTGRES_PASSWORD: pedidoflow_test
      POSTGRES_DB: pedidoflow_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidoflow -d pedidoflow_test"]
      interval: 3s
      timeout: 5s
      retries: 10
