# =============================================================================
# PedidoFlow — nginx para VPS
# =============================================================================
#
# TROQUE `SEU_DOMINIO.com.br` pelo seu domínio antes de usar.
#
# Instalação (Ubuntu/Debian):
#   sudo cp nginx.conf /etc/nginx/sites-available/pedidoflow
#   sudo ln -sf /etc/nginx/sites-available/pedidoflow /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU_DOMINIO.com.br     # emite o certificado
#
# -----------------------------------------------------------------------------
# POR QUE A VERSÃO ANTERIOR NÃO SERVIA PARA PRODUÇÃO
# -----------------------------------------------------------------------------
#
# 1. SÓ HTTP (porta 80), sem TLS. Isso QUEBRA O LOGIN, e de um jeito que
#    não dá erro nenhum: o cookie de sessão é gravado com a flag `Secure`
#    quando NODE_ENV=production (src/app/api/auth/login/route.ts). O
#    navegador se recusa a guardar cookie `Secure` numa página HTTP. O
#    usuário digita a senha, o servidor responde 200, e ele volta para a
#    tela de login sem mensagem de erro nenhuma. Um dia inteiro de
#    depuração procurando bug de autenticação que não existe.
#
# 2. SEM `proxy_buffering off`. O painel da cozinha (KDS), mesas e entregas
#    usam SSE (/api/kds/eventos, /api/eventos). O nginx bufferiza a
#    resposta por padrão, então os eventos ficam presos e a tela nunca
#    atualiza sozinha — o KDS cai no polling de fallback e parece "lento"
#    sem motivo aparente.
#
# 3. SEM `client_max_body_size`. O padrão do nginx é 1 MB. Foto de produto
#    e PDF de nota fiscal estouram e retornam 413.
#
# 4. `proxy_read_timeout` padrão (60s) derruba a conexão SSE a cada minuto.
#
# 5. O `X-Forwarded-For` era montado com `$proxy_add_x_forwarded_for`, que
#    CONCATENA o valor mandado pelo cliente. Como `ipDaRequisicao()`
#    (src/lib/rate-limit.ts) lê o PRIMEIRO IP da lista, bastava mandar
#    `X-Forwarded-For: 1.2.3.4` e trocar o valor a cada tentativa para
#    escapar do rate limit de login e do lockout de conta — força bruta
#    livre. Corrigido abaixo.
#
# 6. O bloco `location /api/` duplicava o `/` sem os headers de upgrade,
#    ou seja, a API perdia o que o bloco raiz tinha. Foi unificado.
# =============================================================================

upstream pedidoflow {
    # A aplicação roda em UM ÚNICO processo Node (ver instrumentation.ts:
    # os eventos em tempo real são em memória; PM2 em modo cluster quebra
    # o tempo real). Não adicione mais servidores aqui sem antes trocar o
    # EventEmitter por Redis ou Postgres LISTEN/NOTIFY.
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP: só para o desafio do certbot e para redirecionar ----------------
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: a aplicação ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SEU_DOMINIO.com.br;

    # Preenchidos pelo `certbot --nginx`. Se editar à mão, aponte para os
    # arquivos reais — o nginx não sobe com caminho inválido.
    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Fotos de produto, logo da empresa, PDF de nota fiscal.
    client_max_body_size 25m;

    # Os headers de segurança (HSTS, CSP, X-Frame-Options...) já vêm da
    # aplicação, em next.config.mjs. Não duplique aqui: header repetido com
    # valor diferente é fonte clássica de comportamento inconsistente.

    # --- SSE / tempo real: cozinha, mesas, entregas, impressão ------------
    # Precisa vir ANTES do `location /`, senão o bloco genérico atende.
    location ~ ^/api/(kds/eventos|eventos) {
        proxy_pass http://pedidoflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # O trio que faz SSE atravessar o nginx.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # A aplicação manda heartbeat a cada 15s; 1h de folga é de sobra.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Assets estáticos do Next (hash no nome: cache longo) -------------
    location /_next/static/ {
        proxy_pass http://pedidoflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Aplicação --------------------------------------------------------
    location / {
        proxy_pass http://pedidoflow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr, NUNCA $proxy_add_x_forwarded_for — ver nota 5 acima.
        # Isto descarta o header forjado pelo cliente e envia só o IP real
        # da conexão, que é o que o rate limit precisa para funcionar.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
